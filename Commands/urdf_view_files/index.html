<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>urdf-view</title>
<style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #14171c; font-family: ui-monospace, monospace; color: #cdd3da; }
    #app { position: absolute; inset: 0; }
    #hud {
        position: absolute; top: 12px; left: 12px; pointer-events: none;
        font-size: 12px; line-height: 1.5; opacity: 0.75; white-space: pre;
    }
    #panel {
        position: absolute; top: 12px; right: 12px; width: 240px;
        background: rgba(20,23,28,0.92); border: 1px solid #2c333d; border-radius: 8px;
        padding: 12px; font-size: 12px;
    }
    #panel h2 { margin: 0 0 8px; font-size: 12px; color: #8fa3b8; letter-spacing: 0.04em; }
    #selected { color: #e6edf3; min-height: 16px; }
    #neighbors { margin: 6px 0 12px; opacity: 0.8; }
    #download {
        width: 100%; padding: 8px; cursor: pointer; border: 0; border-radius: 6px;
        background: #2f6feb; color: white; font: inherit; font-size: 12px;
    }
    #download:hover { background: #4079ec; }
    .x { color: #ff5d5d; } .y { color: #5dff8a; } .z { color: #5d9bff; }
    #origin { margin-bottom: 12px; }
    .axisrow { display: grid; grid-template-columns: 14px 1fr 1fr; gap: 6px; align-items: center; margin: 4px 0; }
    .colhead { display: grid; grid-template-columns: 14px 1fr 1fr; gap: 6px; font-size: 10px; color: #6b7785; margin-bottom: 2px; }
    .numin {
        width: 100%; box-sizing: border-box; background: #1b2026; color: #e6edf3;
        border: 1px solid #2c333d; border-radius: 4px; padding: 3px 5px; font: inherit; font-size: 12px;
    }
    .numin:disabled { opacity: 0.4; }
    .numin:focus { outline: 1px solid #2f6feb; border-color: #2f6feb; }
    #thickness {
        position: absolute; bottom: 12px; left: 12px;
        background: rgba(20,23,28,0.92); border: 1px solid #2c333d; border-radius: 8px;
        padding: 6px 8px; font-size: 12px; display: flex; align-items: center; gap: 8px;
    }
    #thickness button {
        width: 26px; height: 26px; cursor: pointer; border: 1px solid #2c333d;
        border-radius: 6px; background: #232a33; color: #cdd3da; font: inherit; font-size: 16px;
    }
    #thickness button:hover { background: #2f6feb; color: white; }
    #thickness span { color: #8fa3b8; }
    #tree {
        position: absolute; top: 78px; left: 12px; width: 200px; max-height: calc(100% - 150px);
        overflow: auto; background: rgba(20,23,28,0.92); border: 1px solid #2c333d; border-radius: 8px;
        padding: 8px 6px; font-size: 12px;
    }
    #tree h2 { margin: 0 0 6px 6px; font-size: 12px; color: #8fa3b8; letter-spacing: 0.04em; }
    .treenode { padding: 2px 6px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
    .treenode:hover { background: #232a33; }
    .treenode.sel { background: #ffffff; color: #14171c; }
    .treenode.nbr { color: #ffd45d; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.160.0"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="hud">wasd: move   qe: down/up   ijkl: look   drag: orbit
click frame: show connections
drag a basis arrow: move that axis   ctrl/cmd+z: undo</div>
<div id="tree"><h2>FRAMES</h2></div>
<div id="thickness">
    <button id="thinner" title="thinner / smaller arrows">−</button>
    <span>arrows</span>
    <button id="thicker" title="thicker / bigger arrows">+</button>
</div>
<div id="panel">
    <h2>SELECTED FRAME</h2>
    <div id="selected">(none)</div>
    <div id="neighbors"></div>
    <div id="origin">
        <div class="colhead"><span></span><span>pos (m)</span><span>angle (°)</span></div>
        <div class="axisrow"><span class="x">x</span>
            <input id="px" class="numin" type="number" step="0.01" disabled>
            <input id="rx" class="numin" type="number" step="1" disabled></div>
        <div class="axisrow"><span class="y">y</span>
            <input id="py" class="numin" type="number" step="0.01" disabled>
            <input id="ry" class="numin" type="number" step="1" disabled></div>
        <div class="axisrow"><span class="z">z</span>
            <input id="pz" class="numin" type="number" step="0.01" disabled>
            <input id="rz" class="numin" type="number" step="1" disabled></div>
    </div>
    <button id="download">Download URDF</button>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
